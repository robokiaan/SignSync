name: Deploy static site to GitHub Pages

# Serves app/static/ as-is, after regenerating the dictionary/lessons/
# sentences JSON (scripts/build_static_data.py) from the source manifests -
# see that script's docstring. The reference videos ship with it from
# app/static/videos - the 720p fast-start set built by
# scripts/transcode_videos.py (~110 MB) - so Pages serves them same-origin as
# video/mp4 with range requests, which phones need.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # build_static_data.py imports app.seed for the category map and slug
      # rule, and app.seed pulls in app.database (SQLAlchemy) at import time -
      # so the backend deps have to be present even though no DB is touched.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build static data (dictionary/lessons/sentences JSON)
        run: python scripts/build_static_data.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Switch Pages on (source = GitHub Actions) if the repo hasn't yet.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
